apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr
  namespace: smartfunding-dev
  labels:
    app.kubernetes.io/name: smartfunding-ocr
    app.kubernetes.io/component: ocr
    app.kubernetes.io/part-of: smartfunding-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: smartfunding-ocr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smartfunding-ocr
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ocr
          image: ghcr.io/smartfunding-manager/smartfunding-ocr:latest
          ports:
            - containerPort: 3010
          envFrom:
            - configMapRef:
                name: ocr-config
            - secretRef:
                name: ocr-secrets
                optional: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 3010
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 3010
            initialDelaySeconds: 15
            periodSeconds: 10
