apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr
  namespace: smartfunding
  labels:
    app: ocr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ocr
  template:
    metadata:
      labels:
        app: ocr
    spec:
      containers:
        - name: ocr
          image: smartfunding-ocr:latest
          ports:
            - containerPort: 3006
          envFrom:
            - configMapRef:
                name: ocr-config
            - secretRef:
                name: ocr-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 3006
            initialDelaySeconds: 15
            periodSeconds: 10
