global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Services applicatifs (profil app — cibles DOWN tant que --profile app n'est pas lancé, c'est normal)
  - job_name: 'smartfunding-services'
    static_configs:
      - targets:
          - gateway:4000
          - auth:3001
          - projects:3002
          - documents:3003
          - funders:3004
          - ai:3005
          - workflow:3006
          - notifications:3007
          - billing:3008
          - ocr:3010

  # Infra (toujours UP avec docker-compose.infra.yml)
  - job_name: 'smartfunding-infra'
    static_configs:
      - targets:
          - postgres:5432
          - redis:6379
          - rabbitmq:15672
          - minio:9000
          - elasticsearch:9200
